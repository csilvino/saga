nome: Marés Silenciosas
descricao: O oceanógrafo Tomás Albuquerque sumiu de casa sem deixar rastro. A irmã dele contratou você para descobrir
  para onde ele foi, e a resposta começa numa máquina escondida sob a mansão.
inicio: Escritório de Tomás
apresentacao:
  estilo: classico
  layout: classico
  retro: false
arte:
  estilo: pintura digital colorida de adventure point-and-click, ilustração detalhada, luz quente em interiores
    e trópico vibrante nas ilhas
  referencia: Colina da Chegada
requisitos:
  cenas: 20
  puzzles: 14
  mortes: 12
cenas:
- nome: Escritório de Tomás
  descricao: Paredes azuis, um tapete gasto e o cheiro de papel velho. Tudo está arrumado demais, como se o dono
    tivesse saído com pressa e alguém tivesse guardado tudo depois. Uma escada estreita sobe para o sótão.
  script: |
    on first_enter {
      say "Lúcia Albuquerque deixou a chave com você: 'Meu irmão sumiu há três semanas. A polícia desistiu. Eu não.'"
    }
    on enter {
      if flag(tomas_resgatado) {
        play "porta abrindo, passos apressados e choro de alegria"
        end "Vocês sobem pela escada do alçapão, cobertos de areia e sal. Lúcia está no escritório, sentada na cadeira do irmão. Ela levanta devagar, como quem não acredita, e corre para abraçá-lo. Tomás voltou para casa."
      }
    }
  saidas:
    norte: Biblioteca
    cima: Sótão
  som: sala silenciosa de casa antiga, relógio distante, chuva fina na janela
  objetos:
  - nome: escrivaninha
    descricao: Uma escrivaninha de tampo corrido em madeira escura, com um lampião aceso em cima. A tampa está abaixada.
    tipo: movel
    apelidos:
    - mesa
    - tampa
    script: |
      on open {
        if flag(escrivaninha_aberta) { say "Já está aberta. Só papéis de contas lá dentro." }
        else { set escrivaninha_aberta; show "chave de latão"; play "tampa de madeira de escrivaninha rolando e abrindo"; say "A tampa corre com um ruído seco. Entre contas de luz, uma pequena chave de latão." }
      }
  - nome: chave de latão
    descricao: Uma chave pequena de latão, com uma etiqueta escrita à mão - 'baú'.
    pegavel: true
    escondido: true
    apelidos:
    - chave pequena
    - chave do bau
  - nome: relógio de pêndulo
    descricao: Um relógio regulador de parede, visto bem de frente, pendurado na parede entre a escrivaninha e a
      mesa - caixa de madeira escura curta e estreita, de fundo reto, sem pés e sem base, com mostrador redondo
      de marfim no alto e, logo abaixo, uma portinhola de vidro com o pêndulo.
    tipo: movel
    apelidos:
    - relogio
    - pendulo
    - pêndulo
    script: |
      on examine {
        say "O pêndulo vai e vem, tique, taque. Alguém continua dando corda nele. Os ponteiros marcam a hora certa, mas o calendário da parede parou há três semanas."
      }
    som: tique-taque lento e grave de relógio de pêndulo de madeira
    partes:
    - nome: pêndulo de latão
      descricao: Um pêndulo de latão comprido e fino, com um disco de latão grande, redondo e chato na ponta de
        baixo, bem mais largo que a haste.
      animacao:
        tipo: balanco
        angulo: 9.0
        periodo: 2.0
      onde:
      - 0.505
      - 0.595
      altura: 0.19
  - nome: tapete
    descricao: Um tapete encardido, mas parece de fino trato e caro. Uma das pontas está levantada, como se alguém
      o tivesse mexido há pouco.
    tipo: movel
    apelidos:
    - alçapão
    - alcapao
    script: |
      on take {
        set tapete_enrolado; link baixo to Porão; link cima to "Escritório de Tomás" in Porão
        hide self; take "tapete persa"
        play "tapete pesado sendo enrolado e arrastado sobre assoalho de madeira"
        say "Você enrola o tapete e o põe no ombro. É pesado, mas é um belo tapete persa: alguém, em algum lugar, pagaria bem por ele. No assoalho, onde ele estava, aparece a tampa de um alçapão com uma argola de ferro. Você a levanta: uma escada de madeira desce para o escuro."
      }
      on pull {
        set tapete_enrolado; link baixo to Porão; link cima to "Escritório de Tomás" in Porão
        hide self; take "tapete persa"
        play "tapete pesado sendo enrolado e arrastado sobre assoalho de madeira"
        say "Você enrola o tapete e o põe no ombro. É pesado, mas é um belo tapete persa: alguém, em algum lugar, pagaria bem por ele. No assoalho, onde ele estava, aparece a tampa de um alçapão com uma argola de ferro. Você a levanta: uma escada de madeira desce para o escuro."
      }
  - nome: tapete persa
    descricao: 'O tapete de Tomás, enrolado. Encardido, mas de fino trato e caro: franjas de seda e um desenho que
      não se vê em qualquer lugar.'
    pegavel: true
    escondido: true
    apelidos:
    - tapete enrolado
    script: |
      on use {
        if here("Capitão Rocha") {
          set troca_feita; remove "tapete persa"; take "chave de ferro"; take facão; take "luvas de couro"
          play "tapete pesado desenrolado sobre balcão de madeira e moedas tilintando"
          say "Rocha desenrola o tapete sobre o balcão e passa a mão nas franjas de seda, devagar. 'Persa. De verdade.' Ele tira do cinto uma chave de ferro e, de baixo do balcão, um facão e um par de luvas grossas de couro. 'A chave abre o depósito. O facão e as luvas, você vai precisar: a selva daqui não deixa ninguém passar de mãos limpas. Calce as luvas antes de enfiar a mão onde não enxerga.'"
        }
        else { say "Trocar com quem? Não há ninguém aqui interessado num tapete." }
      }
  variantes:
  - quando: flag(tapete_enrolado)
    mudanca: alçapão aberto no chão, sem o tapete (você o levou); a escrivaninha continua fechada
  - quando: flag(escrivaninha_aberta)
    mudanca: 'a tampa corrediça da escrivaninha está levantada: aparecem o tampo de escrever, papéis e um bloco
      branco'
  - quando: flag(escrivaninha_aberta) and flag(tapete_enrolado)
    mudanca: escrivaninha aberta e alçapão aberto, sem o tapete
- nome: Sótão
  descricao: O telhado inclinado deixa pouco espaço para ficar em pé. Poeira grossa no assoalho, caixas de papelão
    e, encostado na parede, um baú antigo com ferragens.
  saidas:
    baixo: Escritório de Tomás
  som: sótão abafado, madeira do telhado estalando, vento leve nas telhas
  objetos:
  - nome: baú de Tomás
    descricao: Um baú de madeira com cantos de latão e uma fechadura pequena.
    tipo: movel
    apelidos:
    - bau
    - baú
    - bau de tomas
    script: |
      on open {
        if flag(bau_aberto) { say "Já está aberto." }
        else { say "Trancado. A fechadura é pequena, de latão." }
      }
      on use with "chave de latão" {
        if flag(bau_aberto) { say "Já está aberto." }
        else {
          set bau_aberto; show "cartão perfurado"; show "carta das marés"; show lanterna; show "caixa de bijuterias"
          play "fechadura de latão girando e tampa de baú de madeira rangendo"
          say "A chave gira e a tampa range ao subir. Dentro do baú: um cartão perfurado, uma carta náutica dobrada, uma lanterna de metal prateada e uma caixinha de bijuterias baratas."
        }
      }
  - nome: cartão perfurado
    descricao: Um cartão de papelão grosso, cheio de furos em fileiras. No canto, a lápis - 'coordenadas, maré morta'.
    pegavel: true
    escondido: true
    apelidos:
    - cartao
    - cartão
  - nome: carta das marés
    descricao: Uma carta náutica antiga de um arquipélago sem nome, com horários de maré anotados à mão e um círculo
      em volta de uma ilhota.
    pegavel: true
    escondido: true
    apelidos:
    - carta nautica
    - carta náutica
    - mapa
    - mapa das mares
  - nome: lanterna
    descricao: Uma lanterna de metal prateada, pesada, com pilhas novas.
    pegavel: true
    escondido: true
    script: |
      on use {
        if not has(lanterna) { say "Primeiro pegue a lanterna." }
        else if flag(lanterna_acesa) { say "Já está acesa." }
        else {
          set lanterna_acesa; play "clique de interruptor de lanterna de metal"
          say "Clique. Um facho de luz amarela corta a escuridão."
        }
      }
  - nome: caixa de bijuterias
    descricao: Uma caixinha de madeira pintada, cheia de colares de contas coloridas, anéis de lata e brincos de
      vidro que brilham como pedras preciosas. Não valem nada aqui. Em outro lugar, quem sabe.
    pegavel: true
    escondido: true
    apelidos:
    - caixa
    - caixinha
    - bijuterias
    - colares
    script: |
      on use {
        if in("Praia Branca") and not flag(nativos_calmos) {
          set nativos_calmos; remove "caixa de bijuterias"
          play "tambores parando, murmúrio de vozes animadas e colares tilintando"
          say "Você abre a caixa e a deixa na areia, aberta, virada para a mata. Por um longo momento, nada. Então mãos rápidas a levam para dentro das folhas, e os tambores param. Uma voz ri. Uma lança é cravada na areia, de ponta para baixo: você pode passar."
        }
        else { say "Ninguém aqui quer bijuterias." }
      }
  variantes:
  - quando: flag(bau_aberto)
    mudanca: só o baú de madeira no centro muda - a tampa curva está aberta, levantada para trás, mostrando o interior
      de madeira escura. A caixa de papelão com colares, o assoalho e a abertura da escada continuam exatamente
      iguais
- nome: Biblioteca
  descricao: Estantes do chão ao teto por todos os lados e, no meio, uma escrivaninha sob a luz de um abajur.
  saidas:
    sul: Escritório de Tomás
  som: biblioteca silenciosa, papel virando, madeira estalando de leve
  objetos:
  - nome: diário de Tomás
    descricao: Um caderno de capa de couro, aberto sobre a escrivaninha.
    tipo: livro
    apelidos:
    - diario
    - diário
    - caderno
    script: |
      on examine {
        set leu_diario
        say "A última página, com letra apressada: 'A ilha só existe na maré morta. A máquina leva até lá, mas só com o cartão de coordenadas, que guardei no baú do sótão. A passagem para o laboratório fica atrás da estante do porão: é só empurrar a lateral esquerda.'"
      }
- nome: Porão
  descricao: 'Chão de cimento rachado e prateleiras cheias de caixas, escuro como breu: só o facho da lanterna mostra
    alguma coisa. A escada de madeira sobe de volta ao alçapão do escritório. Uma das estantes está estranhamente
    afastada da parede.'
  som: porão úmido e silencioso, gotas de água pingando
  objetos:
  - nome: estante do porão
    descricao: Uma estante alta de madeira, cheia de caixas e potes. Há marcas de arrasto no chão em frente a ela.
    tipo: movel
    apelidos:
    - estante
    - prateleira
    script: |
      on push {
        if flag(estante_movida) { say "A passagem já está aberta, a leste." }
        else if flag(leu_diario) {
          set estante_movida; link leste to "Passagem Secreta"; link oeste to "Porão" in "Passagem Secreta"
          play "estante pesada de madeira deslizando sobre piso de cimento"
          say "Você empurra a lateral esquerda. A estante gira sobre um eixo escondido e revela um corredor de pedra, a leste."
        }
        else { say "Ela não se mexe. As marcas no chão dizem que já se moveu muitas vezes; deve haver um jeito certo." }
      }
      on pull { say "Ela não sai do lugar puxando." }
  variantes:
  - quando: flag(estante_movida)
    mudanca: só a estante de madeira alta iluminada à direita do centro muda - ela girou sobre um eixo e está afastada
      em ângulo, e na parede de trás, onde ela estava, abriu-se uma passagem em arco de pedra escura que leva a
      um corredor de pedra. O facho de luz quente da lanterna continua no mesmo lugar, agora iluminando a passagem
      em arco e a estante girada. A escada, o balde e o resto do porão continuam exatamente iguais e escuros
  escuro:
    quando: not (flag(lanterna_acesa) and (has(lanterna) or here(lanterna)))
    morte: Você tateia no escuro, tropeça numa caixa e bate a cabeça no cimento. Lá em cima, ninguém ouve nada.
- nome: Passagem Secreta
  descricao: 'Um corredor de pedra antiga, muito mais velho que a casa, mergulhado no escuro: só o facho da lanterna
    mostra as paredes úmidas. Ao norte, o corredor segue para uma porta em arco.'
  saidas:
    norte: Laboratório
  som: corredor de pedra no escuro, gotas pingando, eco de passos
  escuro:
    quando: not (flag(lanterna_acesa) and (has(lanterna) or here(lanterna)))
    morte: No escuro, o chão de pedra some sob os seus pés. Você escorrega num degrau limo e bate a nuca na parede
      antiga. O corredor guarda mais um segredo.
- nome: Laboratório
  descricao: 'Painéis apagados, cabos grossos pelo chão e, no centro, um grande anel de metal sobre uma plataforma.
    Está tudo desligado: só o facho da lanterna mostra alguma coisa.'
  saidas:
    sul: Passagem Secreta
  som:
    ambiente: sala subterrânea silenciosa no escuro, gotas pingando ao longe, eco abafado
    quando:
    - quando: flag(energia)
      ambiente: laboratório com máquinas zumbindo, estalos elétricos, bipes de painéis
  objetos:
  - nome: alavanca de energia
    descricao: Uma alavanca grande num dos painéis, marcada 'ENERGIA'. Está para baixo.
    tipo: movel
    apelidos:
    - alavanca
    - energia
    script: |
      on pull {
        if flag(energia) { say "Já está ligada." }
        else { set energia; play "alavanca de metal puxada e máquinas elétricas ganhando força, zumbido crescente"; say "Você puxa a alavanca. As luzes piscam, os mostradores sobem e o anel começa a zumbir." }
      }
      on push { say "Ela está para baixo; teria de puxar." }
  - nome: painel de controle
    descricao: Um console à esquerda, com telas azuis, teclas e uma fenda estreita do tamanho de um cartão.
    tipo: movel
    apelidos:
    - painel
    - fenda
    script: |
      on use with "cartão perfurado" {
        if flag(painel_programado) { say "O cartão já está no painel." }
        else { set painel_programado; remove "cartão perfurado"; play "cartão de papel entrando numa leitora mecânica, cliques e bipes"; say "O painel engole o cartão, estala por um tempo e mostra uma linha de números. Coordenadas gravadas." }
      }
  - nome: anel de energia
    descricao: Um anel de metal com mais de dois metros, coberto de bobinas. Seja o que for, Tomás construiu isso
      para ir a algum lugar.
    tipo: maquina
    apelidos:
    - anel
    - maquina
    - máquina
    - portal
    script: |
      on use {
        if flag(portal_ativo) { say "O anel está aberto. É só entrar." }
        else if not flag(energia) { say "Nada acontece. A máquina está sem energia." }
        else if not flag(painel_programado) {
          play "descarga elétrica violenta e estrondo de energia"
          end "O anel se acende sem destino nenhum. A luz azul puxa você para dentro e espalha cada pedaço seu entre lugar nenhum e coisa nenhuma. Sem coordenadas, a máquina de Tomás não leva a lugar algum."
        }
        else {
          set portal_ativo; link entrar to "Colina da Chegada"
          play "zumbido elétrico crescendo até um redemoinho de energia se abrir"
          say "O anel acende por dentro: um redemoinho de luz azul, com cheiro de mar. Dá para entrar."
        }
      }
  variantes:
  - quando: flag(energia)
    mudanca: 'energia ligada: luzes, telas e o anel acesos'
  - quando: flag(portal_ativo)
    mudanca: um portal dimensional aberto sobre a plataforma, com uma ilha tropical do outro lado
  escuro:
    quando: not flag(energia) and not (flag(lanterna_acesa) and (has(lanterna) or here(lanterna)))
    morte: Você tateia no escuro, o pé se enrosca num cabo grosso e a mão bate num terminal desencapado. Um estalo
      azul, um cheiro de queimado, e depois nada.
- nome: Colina da Chegada
  descricao: Uma trilha de terra sobe entre palmeiras e flores enormes, sob um céu limpo demais para ser real. No
    alto da trilha, o portal de pedras por onde você chegou ainda gira, azul e zumbindo.
  script: |
    on first_enter {
      say "Você atravessa a luz e cai de joelhos numa trilha quente. O ar é salgado. Não há sinal de casa, nem de ninguém."
    }
  saidas:
    leste: Posto do Capitão Rocha
    sul: Pântano
    norte: Selva Densa
    entrar:
      para: Laboratório
      volta: false
  som: selva tropical de dia, pássaros exóticos, insetos, brisa nas palmeiras
- nome: Posto do Capitão Rocha
  descricao: Uma velha loja de madeira. Um balcão comprido atravessa a sala e, atrás dele, prateleiras expõem garrafas,
    lampiões, cordas, conchas, mapas enrolados e bugigangas do mundo inteiro. Atrás do balcão, entre moedas e quinquilharias,
    um velho de barba branca observa você sem piscar, ao lado de um livro grosso de capa vermelha. Na parede do
    fundo, uma porta de tábuas grossas está trancada por um cadeado de ferro pendurado na frente.
  saidas:
    oeste: Colina da Chegada
  som: interior de cabana de madeira, tábuas rangendo, sinos de vento lá fora, mar distante
  objetos:
  - nome: Capitão Rocha
    descricao: Um velho negociante de pé atrás do balcão, visto da cintura para cima, com as mãos grandes apoiadas
      na madeira. Barba branca e cheia, pele queimada de sol, um quepe de capitão desbotado, camisa de linho clara
      com as mangas dobradas e um colete marrom de couro gasto. Um olhar esperto, de quem nunca perdeu uma troca.
    tipo: personagem
    apelidos:
    - rocha
    - capitao
    - capitão
    - negociante
    - velho
    script: |
      on talk {
        if flag(troca_feita) { say "'Negócio é negócio', diz Rocha, alisando o tapete. 'Cuidado com o que mora em tronco oco. E na ilhota, quem chega de mãos vazias não sai.'" }
        else { say "'Aqui ninguém usa dinheiro, forasteiro. Aqui se troca.' Ele olha você de cima a baixo. 'Gente que vem pelo círculo de pedras às vezes traz coisas bonitas do outro lado. Panos bordados, tapetes... Isso sim eu aceito.'" }
      }
      on use with "tapete persa" {
        if flag(troca_feita) { say "Já negociamos." }
        else {
          set troca_feita; remove "tapete persa"; take "chave de ferro"; take facão; take "luvas de couro"
          play "tapete pesado desenrolado sobre balcão de madeira e moedas tilintando"
          say "Rocha desenrola o tapete sobre o balcão e passa a mão nas franjas de seda, devagar. 'Persa. De verdade.' Ele tira do cinto uma chave de ferro e, de baixo do balcão, um facão e um par de luvas grossas de couro. 'A chave abre o depósito. O facão e as luvas, você vai precisar: a selva daqui não deixa ninguém passar de mãos limpas. Calce as luvas antes de enfiar a mão onde não enxerga.'"
        }
      }
      on take { say "Rocha segura o seu pulso com uma força que não combina com a idade. 'Aqui se troca. Não se toma.'" }
  - nome: chave de ferro
    descricao: Uma chave de ferro grande e enferrujada.
    pegavel: true
    escondido: true
    apelidos:
    - chave grande
  - nome: facão
    descricao: Um facão de lâmina larga e cabo de madeira gasto, bem afiado.
    pegavel: true
    escondido: true
    apelidos:
    - facao
    - machete
    - faca
  - nome: luvas de couro
    descricao: Um par de luvas grossas de couro curtido, de cano longo, gastas nos dedos. Luvas de quem mexe em
      mato e em bicho.
    pegavel: true
    escondido: true
    apelidos:
    - luva
    - luvas
    - luva de couro
    script: |
      on use {
        if not has("luvas de couro") { say "Primeiro pegue as luvas." }
        else if flag(luvas_calcadas) { say "Você já está com elas." }
        else { set luvas_calcadas; play "luvas grossas de couro sendo calçadas"; say "Você calça as luvas. O couro é duro e quente, e vai até o meio do braço." }
      }
  - nome: livro de contas
    descricao: Um livro grosso de capa vermelha, aberto sobre o balcão, ao lado da bola de cristal.
    tipo: livro
    apelidos:
    - livro
    - contas
    script: |
      on examine {
        say "Contas do Capitão Rocha, em letra torta. Trocas e mais trocas. Uma das últimas: 'Ao forasteiro de barba castanha: bússola, remo e bomba de ar, em troca de um relógio de bolso. Ficaram no depósito, ele volta para buscar.' Nunca voltou. Mais abaixo: 'Os da ilhota não deixam ninguém passar sem presente. Gostam de coisa que brilha.'"
      }
  - nome: porta dos fundos
    descricao: Uma porta de tábuas grossas atrás do balcão, trancada por um cadeado de ferro.
    tipo: porta
    apelidos:
    - porta
    - cadeado
    script: |
      on open {
        if flag(deposito_aberto) { say "Já está aberta. O depósito fica ao norte." }
        else { say "O cadeado de ferro não cede." }
      }
      on use with "chave de ferro" {
        if flag(deposito_aberto) { say "Já está aberta." }
        else { set deposito_aberto; link norte to "Depósito dos Fundos"; link sul to "Posto do Capitão Rocha" in "Depósito dos Fundos"; play "cadeado de ferro enferrujado abrindo e porta de madeira rangendo"; say "O cadeado abre com um estalo. Você o tira da argola e o deixa no chão. A porta dá para o depósito, ao norte." }
      }
  variantes:
  - quando: flag(deposito_aberto)
    mudanca: a porta de tábuas atrás do balcão está escancarada para dentro, sem cadeado, e pela abertura se vê
      o depósito na penumbra; o balcão sem a bola de cristal
- nome: Depósito dos Fundos
  descricao: Um quarto de tábuas com uma janela pequena e uma lâmpada fraca. Cordas, garrafas e caixas pelo chão.
    Contra a parede, um baú com ferragens pesadas.
  som: depósito de madeira abafado, lâmpada zumbindo, ondas lá fora
  objetos:
  - nome: baú do capitão
    descricao: Um baú grande, reforçado com ferro, sem tranca.
    tipo: movel
    apelidos:
    - bau
    - baú
    - bau do capitao
    script: |
      on open {
        if flag(bau_capitao_aberto) { say "Já está aberto." }
        else { set bau_capitao_aberto; show bússola; show remo; show "bomba de ar"; play "tampa pesada de baú com ferragens abrindo"; say "A tampa é pesada. Dentro: uma bússola de latão, um remo curto e uma bomba de ar de pé." }
      }
  - nome: bússola
    descricao: Uma bússola de latão. A agulha treme mas aponta firme para o norte.
    pegavel: true
    escondido: true
    apelidos:
    - bussola
  - nome: remo
    descricao: Um remo curto de madeira, de bote.
    pegavel: true
    escondido: true
  - nome: bomba de ar
    descricao: Uma bomba de ar de pé, com uma mangueira de borracha.
    pegavel: true
    escondido: true
    apelidos:
    - bomba
  variantes:
  - quando: flag(bau_capitao_aberto)
    mudanca: só o baú grande com ferragens de ferro, à direita da porta, muda - a tampa curva está aberta, levantada
      para trás, mostrando o interior de madeira escura. A porta aberta, a lanterna, as mesas e o resto do depósito
      continuam exatamente iguais
- nome: Pântano
  descricao: Árvores retorcidas e cobertas de musgo saem de uma água escura e parada. A névoa não deixa ver longe.
    Um tronco caído, oco por dentro, atravessa a margem.
  saidas:
    norte: Colina da Chegada
    leste: Galpão de Barcos
  som: pântano com sapos coaxando, insetos, água borbulhando, névoa parada
  objetos:
  - nome: tronco oco
    descricao: Um tronco grosso, caído e oco, coberto de musgo.
    tipo: movel
    apelidos:
    - tronco
    script: |
      on examine {
        if flag(cobra_fugiu) { say "Oco e vazio, só folhas podres." }
        else { say "Coberto de musgo, oco por dentro. Lá no fundo, entre as folhas podres, alguma coisa se mexe e chia baixinho." }
      }
      on open {
        if flag(cobra_fugiu) { say "Só folhas podres e água. Nada que valha alguma coisa." }
        else {
          if flag(luvas_calcadas) and has("luvas de couro") {
            set cobra_fugiu; play "chiado de cobra e bote rápido entre folhas secas"
            say "Você enfia a mão no oco. Uma pancada seca no pulso: uma jararaca cravou os dentes na luva, mas o couro grosso aguentou. Você puxa o braço com a cobra pendurada; ela se solta, cai na lama e some na água escura. Lá dentro, só folhas podres."
          }
          else {
          play "chiado de cobra e bote rápido entre folhas secas"
          end "Você enfia a mão no oco, entre as folhas podres. Uma picada no pulso, rápida como um estalo. A jararaca some na água escura, e o seu braço começa a queimar. O pântano fica muito longe de qualquer socorro."
          }
        }
      }
      on use with facão {
        if flag(cobra_fugiu) { say "Não há mais nada lá dentro." }
        else { set cobra_fugiu; play "facão batendo em madeira podre e cobra escorregando na água"; say "Você cutuca o oco com a ponta do facão. Uma jararaca enorme escorrega para fora, sibila para você e some na água escura. Melhor não ter posto a mão." }
      }
      on use { say "Enfiar a mão aí dentro? Algo se mexe no fundo." }
- nome: Galpão de Barcos
  descricao: Um galpão de tábuas que range com o vento. Ferramentas numa bancada, potes e cordas, e no chão um bote
    cinza murcho. Uma trilha segue para o norte, até o mar.
  saidas:
    oeste: Pântano
    norte: Praia do Barco Velho
  som: galpão de madeira rangendo, vento entre as tábuas, mar próximo
  objetos:
  - nome: bote inflável
    descricao: Um bote de borracha cinza-esverdeado, murcho, com os dois assentos de madeira soltos por cima.
    tipo: movel
    apelidos:
    - bote
    - barco inflavel
    script: |
      on examine {
        if flag(bote_cheio) { say "Cheio e firme. Pesado, mas dá para arrastar." }
        else { say "Murcho, mas sem furos. Precisa de ar." }
      }
      on use with "bomba de ar" {
        if flag(bote_cheio) { say "Já está cheio." }
        else { set bote_cheio; play "bomba de ar de pé bombeando e bote de borracha enchendo"; say "Você bombeia até o braço doer. O bote endurece, mas numa das costuras do fundo a borracha está fina, gasta. Bote velho é assim: uma hora murcha, outra hora vaza." }
      }
      on push {
        if not flag(bote_cheio) { say "Murcho assim, não vai flutuar." }
        else { set bote_na_praia; hide self; show "bote cinza"; play "bote de borracha sendo arrastado sobre areia"; say "Você arrasta o bote pela trilha, até a beira da água na praia, ao norte." }
      }
      on pull { say "Melhor empurrar: a trilha para a praia é ao norte." }
  - nome: balde
    descricao: Um balde de zinco amassado, com alça de arame.
    pegavel: true
    apelidos:
    - balde de zinco
    script: |
      on use {
        if not has(balde) { say "Primeiro pegue o balde." }
        else if flag(agua_no_bote) {
          clear agua_no_bote
          play "balde jogando água para fora de um bote de borracha, várias vezes"
          say "Você joga balde atrás de balde por cima da borda até o fundo do bote aparecer de novo. A costura ainda verte, mas agora dá para seguir."
        }
        else { say "Não há nada para esvaziar aqui." }
      }
  variantes:
  - quando: flag(bote_cheio)
    mudanca: o bote inflável cinza-esverdeado no chão está cheio, inflado e firme, com os dois bancos de madeira
      no lugar
  - quando: flag(bote_na_praia)
    mudanca: o bote inflável que estava no chão sumiu; só o assoalho de madeira vazio onde ele estava
- nome: Selva Densa
  descricao: Árvores imensas fecham o céu e raízes grossas cruzam o chão. A luz chega verde, em manchas. A leste,
    uma cortina de cipós grossos fecha a mata; atrás dela, entre as pedras, parece haver uma fenda escura.
  saidas:
    sul: Colina da Chegada
    leste: Fenda Escura
  som: selva densa e úmida, pássaros, macacos ao longe, folhas pingando
  objetos:
  - nome: cipós
    descricao: Cipós grossos como braços, emaranhados de árvore em árvore, fechando a passagem para o leste.
    tipo: movel
    apelidos:
    - cipo
    - cipó
    - cipos
    - mata
    - cortina
    script: |
      on examine {
        if flag(cipos_cortados) { say "Cortados. Uma passagem estreita leva a leste, até a fenda." }
        else { say "Grossos como braços, emaranhados. Entre eles, um parece mais liso que os outros, com escamas vermelhas, pretas e amarelas." }
      }
      on use with facão {
        if flag(cipos_cortados) { say "A passagem já está aberta, a leste." }
        else {
          set cipos_cortados; link leste to "Fenda Escura"
          play "facão cortando cipós grossos e galhos caindo"
          say "Você abre caminho a golpes de facão. Um dos cipós se desenrola sozinho e foge rastejando: era uma cobra coral. A passagem para o leste está aberta."
        }
      }
      on pull {
        if flag(cipos_cortados) { say "Já estão cortados." }
        else {
          play "cobra dando bote e grito abafado na mata"
          end "Você agarra os cipós e puxa com força. Um deles é macio demais, e se mexe. A coral morde a sua mão antes que você possa soltar. Na selva, ninguém ouve você cair."
        }
      }
      on take {
        if flag(cipos_cortados) { say "Já estão cortados." }
        else {
          play "cobra dando bote e grito abafado na mata"
          end "Você agarra os cipós para arrancá-los. Um deles é macio demais, e se mexe. A coral morde a sua mão antes que você possa soltar. Na selva, ninguém ouve você cair."
        }
      }
      on push { say "Eles cedem um pouco e voltam, como molas. Sem algo para cortar, não passa." }
  variantes:
  - quando: flag(cipos_cortados)
    mudanca: os cipós da direita foram cortados a facão e abriu-se uma passagem escura entre as árvores
- nome: Fenda Escura
  descricao: Uma rachadura enorme na rocha, molhada e coberta de musgo. A água escorre pelas paredes e some num
    buraco sem fundo no meio do chão.
  script: |
    on enter {
      if not (has(lanterna) and flag(lanterna_acesa)) {
        play "escorregão em pedra molhada e queda no escuro, eco"
        end "Sem luz, você dá dois passos no escuro, pisa no musgo e escorrega para o buraco no meio da fenda. Ninguém nunca vai saber onde você caiu."
      } else {
        say "A luz da lanterna desenha a borda do buraco no meio do chão. Você contorna devagar."
      }
    }
  saidas:
    oeste: Selva Densa
  som: caverna escura, água escorrendo pelas paredes, gotas ecoando
  objetos:
  - nome: medalhão de coral
    descricao: Um disco de coral vermelho, do tamanho da palma da mão, entalhado com ondas. Alguém o deixou cair
      aqui.
    pegavel: true
    apelidos:
    - medalhao
    - medalhão
    - coral
    - disco
- nome: Praia do Barco Velho
  descricao: Areia clara, água transparente e a sombra das árvores. Um barco de madeira apodrece na areia, com o
    casco rachado. Ao norte, só mar.
  script: |
    on enter {
      if flag(agua_no_bote) {
        play "bote de borracha afundando, água borbulhando, ondas"
        end "A praia está ali, a cem metros. Mas o bote já está cheio d'água e afunda de vez, e a arrebentação puxa você para baixo antes da areia."
      }
    }
  saidas:
    sul: Galpão de Barcos
  som: praia tranquila, ondas pequenas na areia, gaivotas, brisa
  objetos:
  - nome: barco velho
    descricao: Um barco de madeira com o casco rachado de ponta a ponta. Não flutuaria nem um minuto.
    tipo: movel
    apelidos:
    - barco de madeira
  - nome: bote cinza
    descricao: O bote inflável, cheio, na beira da água.
    tipo: movel
    escondido: true
    apelidos:
    - bote
    script: |
      on use with remo {
        if flag(bote_na_agua) { say "O bote já está na água. É só remar para o norte." }
        else {
          set bote_na_agua; link norte to "Mar Aberto"
          play "bote de borracha sendo empurrado para a água, remo batendo no mar"
          say "Você empurra o bote para a água e sobe nele com o remo. O mar aberto fica ao norte."
        }
      }
      on push { say "Na água, sem remo, ele só ia ficar boiando." }
- nome: Mar Aberto
  descricao: Só água azul em volta, calma e funda. O bote balança devagar. A praia ficou para trás, ao sul.
  animacao:
    tipo: flutuar
    amplitude: 12.0
    periodo: 5.0
  script: |
    on enter {
      if not has(bússola) {
        play "neblina densa, vento uivando e ondas grandes"
        end "Uma névoa branca cai de repente sobre o mar. Sem saber para onde fica o norte, você rema em círculos até as forças acabarem. O bote cinza some na neblina."
      } else {
        set agua_no_bote
        play "água entrando num bote de borracha, borbulhas"
        say "Uma névoa começa a subir do mar, mas a agulha da bússola aponta firme para o norte. Então você sente os pés molhados: uma costura do fundo cedeu, e a água do mar entra no bote, devagar mas sem parar."
      }
    }
  saidas:
    norte: Mar da Ilhota
    sul:
      para: Praia do Barco Velho
      volta: false
  som: mar aberto, ondas suaves batendo num bote de borracha, vento
  variantes:
  - quando: flag(agua_no_bote)
    mudanca: o fundo do bote está cheio de água do mar
- nome: Mar da Ilhota
  descricao: A névoa se abre. Ao norte, uma ilhota verde surge do mar, como se tivesse acabado de nascer. A água
    está baixa, quase parada.
  script: |
    on enter {
      if flag(agua_no_bote) {
        play "bote de borracha afundando, água borbulhando, gaivotas"
        end "A água já passa dos joelhos. O bote cinza afunda devagar, com você dentro, a poucas braçadas da ilhota. As correntes da maré morta são frias e fundas, e puxam para baixo."
      }
    }
  saidas:
    sul: Mar Aberto
    norte: Praia Branca
  som: mar calmo, ondas distantes, gaivotas sobre uma ilha
- nome: Praia Branca
  descricao: Uma faixa de areia muito branca entre coqueiros e flores vermelhas. A maré está tão baixa que pedras
    escuras aparecem na água. Uma trilha entra na mata ao norte; a oeste, a praia vira uma enseada.
  script: |
    on first_enter {
      play "tambores ao longe na mata, ritmo lento e ameaçador"
      say "Você arrasta o bote para a areia. Tambores começam a soar na mata. Entre as folhas, olhos e pontas de lança acompanham cada passo seu. Ninguém aparece. Ninguém precisa."
    }
    on enter {
      if flag(tomas_resgatado) {
        inc mare
        if flag(mare) > 5 {
          play "ondas fortes engolindo a praia, rugido do mar"
          end "A maré morta acabou. O mar volta de uma vez, alto e rápido, e engole a praia, a trilha e o bote. A ilhota some debaixo d'água, como fazia antes de vocês chegarem. Como fará sempre."
        }
        if not flag(bote_murchou) {
          set bote_murchou; unlink sul
          play "ar escapando de um bote de borracha, risadas na mata"
          say "Na areia, o bote cinza está murcho, mole como um lenço. Da mata vem uma risada abafada: alguém tirou o ar dele enquanto vocês estavam lá dentro. E o mar já começa a subir."
        }
      }
    }
  saidas:
    sul: Mar da Ilhota
    oeste: Enseada Verde
    norte: Clareira das Pedras
  som: praia tropical, ondas suaves, coqueiros balançando, pássaros
  objetos:
  - nome: nativos
    descricao: Você não os vê de verdade. Só olhos entre as folhas, pontas de lança e, de vez em quando, um brilho
      de colar de concha.
    tipo: movel
    apelidos:
    - olhos
    - lancas
    - lanças
    - mata
    - folhas
    script: |
      on talk {
        if flag(nativos_calmos) { say "Uma risada na mata. Alguém balança um colar de contas coloridas entre as folhas." }
        else { say "Silêncio. Depois, os tambores, mais rápidos. Uma lança se finca na areia, a um palmo do seu pé, apontando para a mata. Eles querem alguma coisa." }
      }
      on use with "caixa de bijuterias" {
        set nativos_calmos; remove "caixa de bijuterias"
        play "tambores parando, murmúrio de vozes animadas e colares tilintando"
        say "Você abre a caixa e a deixa na areia, aberta, virada para a mata. Por um longo momento, nada. Então mãos rápidas a levam para dentro das folhas, e os tambores param. Uma voz ri. Uma lança é cravada na areia, de ponta para baixo: você pode passar."
      }
  - nome: bote na areia
    descricao: O bote cinza, arrastado para a areia.
    tipo: movel
    apelidos:
    - bote
    - bote cinza
    script: |
      on examine {
        if flag(bote_murchou) and not flag(bote_recheio) { say "Murcho. Alguém abriu a válvula. Sem ar, não sai daqui." }
        else { say "O bote cinza, na areia, pronto para voltar ao mar." }
      }
      on use with "bomba de ar" {
        if not flag(bote_murchou) { say "Está cheio." }
        else if flag(bote_recheio) { say "Já está cheio de novo." }
        else {
          set bote_recheio; link sul to "Mar da Ilhota"
          play "bomba de ar de pé bombeando e bote de borracha enchendo"
          say "Você bombeia com toda a força, de olho na água que sobe. O bote endurece de novo. Para o sul, o mar."
        }
      }
- nome: Enseada Verde
  descricao: Uma enseada fechada entre rochas, com água verde e parada. Um barco a remo está encalhado na areia.
    No fundo, uma gruta brilha com uma luz verde, fraca.
  script: |
    on enter {
      if not flag(nativos_calmos) {
        play "lança zunindo no ar e baque surdo"
        end "Você dá as costas para a mata. Os tambores param de repente. O silêncio dura um segundo, e a lança chega antes do som. Quem chega à ilhota de mãos vazias não sai dela."
      }
      if flag(tomas_resgatado) {
        inc mare
        if flag(mare) > 5 {
          play "ondas fortes engolindo a praia, rugido do mar"
          end "A água entra na enseada como um rio. Em minutos, a areia, as rochas e a gruta somem. A maré morta acabou, e a ilhota volta para o fundo do mar com vocês dois."
        }
      }
    }
  saidas:
    leste: Praia Branca
  som: enseada calma, água batendo nas rochas, eco suave de gruta
  objetos:
  - nome: barco de Tomás
    descricao: Um barco a remo vermelho, encalhado. No banco, o nome pintado - 'Lúcia'. Debaixo dele, um caderno
      molhado diz, numa letra que você já conhece - 'Perdi o medalhão na fenda escura. Sem ele a porta não abre,
      e a maré não espera.'
    tipo: movel
    apelidos:
    - barco
    - barco vermelho
    - caderno molhado
  - nome: gruta verde
    descricao: Uma gruta rasa, com água verde e fria até a canela. A luz vem de algas que brilham sozinhas. Não
      leva a lugar nenhum.
    tipo: movel
    apelidos:
    - gruta
    - luz verde
- nome: Clareira das Pedras
  descricao: Raios de sol atravessam árvores altas e caem sobre um santuário de pedra coberto de musgo, com degraus
    gastos. Luzes verdes flutuam no ar.
  script: |
    on enter {
      if not flag(nativos_calmos) {
        play "lança zunindo no ar e baque surdo"
        end "Você entra na mata sem olhar para trás. Os tambores param de repente. O silêncio dura um segundo, e a lança chega antes do som. Quem chega à ilhota de mãos vazias não sai dela."
      }
      if flag(tomas_resgatado) {
        inc mare
        if flag(mare) > 5 {
          play "ondas fortes engolindo a floresta, rugido do mar"
          end "A água sobe pela trilha de pedras e invade a clareira, quente e rápida. A maré morta acabou. A ilhota volta para o fundo do mar com vocês dois."
        }
      }
    }
  saidas:
    sul: Praia Branca
    norte: Templo da Maré
  som: clareira de floresta, raios de sol, zumbido místico suave, pássaros
  objetos:
  - nome: santuário
    descricao: Um santuário pequeno de pedra. Na soleira, um sulco raso e comprido, como se esperasse uma folha
      de papel, e ondas entalhadas em volta.
    tipo: movel
    apelidos:
    - santuario
    - sulco
    - soleira
    script: |
      on use with "carta das marés" {
        if flag(mare_baixa) { say "O caminho ao norte já está aberto." }
        else {
          set mare_baixa; remove "carta das marés"; link norte to "Templo da Maré"
          play "ronco grave de pedra e água recuando, ondas se afastando"
          say "Você deita a carta no sulco. As ondas entalhadas acendem uma a uma, e um ronco vem do chão. Ao norte, a mata se abre: uma trilha de pedras que antes estava debaixo d'água."
        }
      }
  variantes:
  - quando: flag(mare_baixa)
    mudanca: as ondas entalhadas em volta da soleira do santuário brilham com luz verde, e uma folha de papel está
      deitada no sulco; ao fundo, a mata se abriu e uma trilha de pedras molhadas, recém-saída da água, segue para
      longe entre as árvores
- nome: Templo da Maré
  descricao: Um templo de pedra engolido pela mata, coberto de raízes e musgo. Uma porta escura, fechada, guarda
    a entrada; no centro dela, um encaixe redondo.
  script: |
    on enter {
      if flag(tomas_resgatado) {
        inc mare
        if flag(mare) > 5 {
          play "ondas fortes engolindo a floresta, rugido do mar"
          end "A água já cobre os degraus do templo. A maré morta acabou, e a ilhota volta para o fundo do mar com vocês dois."
        }
      }
    }
  saidas:
    sul: Clareira das Pedras
  som: templo antigo na selva, vento entre pedras, zumbido grave vindo de dentro
  objetos:
  - nome: porta do templo
    descricao: Uma porta de pedra lisa, sem maçaneta. No centro, um encaixe redondo com ondas entalhadas em volta.
    tipo: porta
    apelidos:
    - porta
    - encaixe
    script: |
      on open {
        if flag(porta_templo_aberta) { say "Já está aberta. É só entrar." }
        else { say "Não há maçaneta. Só o encaixe redondo no centro." }
      }
      on use with "medalhão de coral" {
        set porta_templo_aberta; remove "medalhão de coral"
        link norte to "Câmara da Maré"; link entrar to "Câmara da Maré"
        play "porta de pedra pesada se abrindo com estrondo grave"
        say "O medalhão encaixa com um clique. As ondas entalhadas giram, e a porta afunda devagar no chão. Do vão escuro sai uma luz verde e um cheiro de mar parado. Alguém tosse lá dentro."
      }
  variantes:
  - quando: flag(porta_templo_aberta)
    mudanca: a porta de pedra afundou no chão e a entrada está aberta, um vão escuro de onde sai uma luz verde suave;
      a soleira está vazia, sem ninguém, e o encaixe redondo agora segura um medalhão de coral vermelho
- nome: Câmara da Maré
  descricao: Uma câmara redonda de pedra, úmida e silenciosa. Algas que brilham sozinhas cobrem as paredes de luz
    verde, e ondas entalhadas correm pelo teto baixo. Num canto, um cobertor velho e uma caneca de lata sobre o
    chão de pedra lisa.
  script: |
    on first_enter {
      set tomas_resgatado
      play "eco de passos em câmara de pedra, voz fraca de homem"
      say "À luz verde das algas, Tomás Albuquerque levanta a cabeça, magro e barbudo, mas vivo. 'A maré me prendeu aqui', ele sussurra. 'Achei que ninguém viria.' Você o ajuda a ficar de pé. 'Rápido. A maré morta está acabando. Quando a água voltar, a ilhota afunda, e nós com ela. E o bote... os da mata adoram brincar com o bote.'"
    }
    on enter {
      if visited("Câmara da Maré") and flag(mare) > 0 { say "Tomás puxa o seu braço. 'Não há nada aqui! A maré!'" }
    }
  saidas:
    sul:
      para: Templo da Maré
      volta: false
  som: câmara de pedra fechada, gotas ecoando, zumbido grave e suave, respiração fraca
  objetos:
  - nome: Tomás Albuquerque
    descricao: Personagem de adventure point-and-click pintado no mesmo estilo ilustrado do cenário, o corpo inteiro
      visível da cabeça aos pés descalços, do tamanho de um homem adulto sentado no chão da câmara, ocupando boa
      parte da altura da parede. Um homem magro sentado, abraçando os joelhos dobrados, com barba castanha comprida
      e cheia, cabelo desgrenhado até os ombros, camisa bege lisa e rasgada nas mangas, calça azul gasta. Iluminado
      pela mesma luz verde das algas da câmara, com sombras esverdeadas. Ele olha para cima, cansado e aliviado.
    tipo: personagem
    apelidos:
    - tomás
    - tomas
    - homem
  - nome: caneca de lata
    descricao: Uma caneca de lata pequena e amassada, cinza-prateada, com a alça torta, vazia. Iluminada pela luz
      verde da câmara.
    pegavel: true
    apelidos:
    - caneca
    - lata
