[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I"]
ignore = ["E203"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
